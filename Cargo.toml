[package]
name = "rustspeed"
version = "0.1.0"
description = "Self-hosted network speed test (download, upload, ping, jitter) written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lucas-Rosenzweig/rustspeed"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.2"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
hickory-resolver = "0.26.4"
ipnet = "2.12.2"
mime_guess = "2.0.5"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
